<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="REİM Hikâye - Özgün kısa hikâyeler, gizem, bilim kurgu ve fantastik dünyalar.">
    <title>REİM Hikâye | Özgün Öyküler ve Dünyalar</title>
    <style>
        :root {
            --bg: #f8f5f0;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --accent: #b45309;
            --border: #e2e8f0;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Georgia', serif; line-height: 1.8; transition: 0.3s; }
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); font-family: 'Segoe UI', sans-serif; }
        .theme-btn { background: var(--accent); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-family: 'Segoe UI', sans-serif; font-weight: 600; }
        .container { max-width: 850px; margin: 2.5rem auto; padding: 0 1.5rem; }
        .intro { text-align: center; margin-bottom: 2.5rem; }
        .intro h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .intro p { color: var(--muted); font-family: 'Segoe UI', sans-serif; }
        .filters { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .filter-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-family: 'Segoe UI', sans-serif; font-size: 0.9rem; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .story-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.8rem; margin-bottom: 1.5rem; cursor: pointer; transition: 0.2s; }
        .story-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .story-meta { font-family: 'Segoe UI', sans-serif; font-size: 0.85rem; color: var(--accent); font-weight: bold; margin-bottom: 0.4rem; }
        .story-card h2 { font-size: 1.5rem; margin-bottom: 0.6rem; }
        .story-card p { color: var(--muted); font-size: 1rem; }
        #reader-view { display: none; background: var(--card); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border); }
        .back-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; margin-bottom: 1.5rem; font-family: 'Segoe UI', sans-serif; }
        #reader-title { font-size: 2rem; margin-bottom: 0.5rem; }
        #reader-meta { color: var(--accent); font-family: 'Segoe UI', sans-serif; margin-bottom: 1.5rem; font-size: 0.9rem; }
        #reader-content p { margin-bottom: 1.2rem; font-size: 1.15rem; }
        footer { text-align: center; padding: 2rem; color: var(--muted); font-family: 'Segoe UI', sans-serif; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo">📖 REİM Hikâye</div>
        <button class="theme-btn" onclick="toggleTheme()">🌙 Gece Modu</button>
    </header>
    <div class="container">
        <div id="list-view">
            <div class="intro">
                <h1>Kelimelerin Açtığı Yeni Dünyalar</h1>
                <p>REİM Hikâye arşivine hoş geldin. Okumak istediğin hikâyeyi seç.</p>
            </div>
            <div class="filters">
                <button class="filter-btn active" onclick="filterStories('Tümü', this)">Tümü</button>
                <button class="filter-btn" onclick="filterStories('Bilim Kurgu', this)">Bilim Kurgu</button>
                <button class="filter-btn" onclick="filterStories('Gizem', this)">Gizem</button>
                <button class="filter-btn" onclick="filterStories('Fantastik', this)">Fantastik</button>
            </div>
            <div id="stories-container"></div>
        </div>
        <div id="reader-view">
            <button class="back-btn" onclick="closeReader()">← Tüm Hikâyelere Dön</button>
            <div id="reader-meta"></div>
            <h1 id="reader-title"></h1>
            <div id="reader-content"></div>
        </div>
    </div>
    <footer>REİM Hikâye © 2026 • Tüm Hakları Saklıdır.</footer>
    <script>
        const stories = [
            {
                id: 1,
                title: "İlk Adım: Boş Sayfa",
                category: "Gizem",
                readTime: "1 dk okuma",
                summary: "Her şey, masanın üzerinde duran eski bir defterin ilk sayfasının kendiliğinden dolmasıyla başladı...",
                content: [
                    "Yağmurlu bir Kasım akşamıydı. Pencereden süzülen sokak lambasının sarı ışığı, odadaki tek ahşap masanın üzerine düşüyordu.",
                    "Masanın ortasında duran deri kaplı defter yıllardır boştu. Ancak o gece ilk satırda tek bir cümle belirdi: 'Hikâyeyi yazmaya hazır mısın?'"
                ]
            }
        ];

        function renderStories(category = 'Tümü') {
            const container = document.getElementById('stories-container');
            container.innerHTML = '';
            const filtered = category === 'Tümü' ? stories : stories.filter(s => s.category === category);
            filtered.forEach(story => {
                const card = document.createElement('div');
                card.className = 'story-card';
                card.onclick = () => openReader(story);
                card.innerHTML = `<div class="story-meta">${story.category} • ${story.readTime}</div><h2>${story.title}</h2><p>${story.summary}</p>`;
                container.appendChild(card);
            });
        }
        function filterStories(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderStories(cat);
        }
        function openReader(story) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';
            document.getElementById('reader-meta').innerText = `${story.category} • ${story.readTime}`;
            document.getElementById('reader-title').innerText = story.title;
            document.getElementById('reader-content').innerHTML = story.content.map(p => `<p>${p}</p>`).join('');
            window.scrollTo(0, 0);
        }
        function closeReader() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
        }
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const btn = document.querySelector('.theme-btn');
            btn.innerText = document.body.classList.contains('dark') ? '☀️ Gündüz Modu' : '🌙 Gece Modu';
        }
        renderStories();
    </script>
</body>
</html>
