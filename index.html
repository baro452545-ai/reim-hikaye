<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="REİM Hikâye - Özgün kısa hikâyeler ve dünyalar.">
    <title>REİM Hikâye</title>
    <style>
        :root {
            --bg: #f8f5f0;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --accent: #b45309;
            --border: #e2e8f0;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --border: #334155;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, serif;
            line-height: 1.8;
            transition: 0.3s;
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            font-family: sans-serif;
        }
        .theme-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.2rem;
        }
        #continue-box {
            display: none;
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .continue-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .intro {
            text-align: center;
            margin-bottom: 2rem;
        }
        .filters {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: sans-serif;
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
        }
        .story-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            cursor: pointer;
        }
        .story-card:hover {
            border-color: var(--accent);
        }
        .story-meta {
            font-family: sans-serif;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }
        #reader-view {
            display: none;
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .back-btn {
            background: var(--border);
            border: none;
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        #reader-content p {
            margin-bottom: 1.2rem;
            font-size: 1.15rem;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-family: sans-serif;
        }
        .page-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
            font-family: sans-serif;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📖 REİM Hikâye</div>
        <button type="button" class="theme-btn" id="themeBtn">🌙 Gece Modu</button>
    </header>

    <div class="container">
        <div id="list-view">
            <div id="continue-box">
                <div>
                    <small style="color:var(--accent); font-weight:bold;">🔖 KALDIĞIN YERDEN DEVAM ET</small><br>
                    <strong id="continue-title"></strong>
                </div>
                <button type="button" class="continue-btn" id="continueActionBtn">Devam Et →</button>
            </div>

            <div class="intro">
                <h1>Kelimelerin Açtığı Yeni Dünyalar</h1>
                <p>REİM Hikâye arşivine hoş geldin.</p>
            </div>

            <div class="filters">
                <button type="button" class="filter-btn active" data-cat="Tümü">Tümü</button>
                <button type="button" class="filter-btn" data-cat="Bilim Kurgu">Bilim Kurgu</button>
                <button type="button" class="filter-btn" data-cat="Gizem">Gizem</button>
                <button type="button" class="filter-btn" data-cat="Fantastik">Fantastik</button>
            </div>

            <div id="stories-container"></div>
        </div>

        <div id="reader-view">
            <button type="button" class="back-btn" id="backBtn">← Tüm Hikâyelere Dön</button>
            <div id="reader-meta" style="color:var(--accent); font-family:sans-serif; font-size:0.9rem; margin-bottom:0.5rem;"></div>
            <h1 id="reader-title" style="margin-bottom:1.5rem;"></h1>
            <div id="reader-content"></div>
            <div class="pagination">
                <button type="button" class="page-btn" id="prevBtn">← Önceki Sayfa</button>
                <span id="page-indicator" style="font-weight:bold;">Sayfa 1 / 1</span>
                <button type="button" class="page-btn" id="nextBtn">Sonraki Sayfa →</button>
            </div>
        </div>
    </div>

    <footer>REİM Hikâye © 2026</footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const stories = [
                {
                    id: 1,
                    title: "İlk Adım: Boş Sayfa",
                    category: "Gizem",
                    summary: "Masanın üzerinde duran eski bir defterin ilk sayfasının kendiliğinden dolmasıyla başlayan gizem...",
                    pages: [
                        [
                            "SAYFA 1 — Yağmurlu bir Kasım akşamıydı. Pencereden süzülen sokak lambasının ışığı masaya düşüyordu.",
                            "Deri kaplı defter yıllardır boştu. Ancak o gece ilk satırda tek bir cümle belirdi: Hikâyeyi yazmaya hazır mısın?"
                        ],
                        [
                            "SAYFA 2 — Sayfayı çevirdiğinde mürekkebin hâlâ ıslak olduğunu fark etti. Sanki biri saniyeler önce buradaydı.",
                            "İkinci sayfada artık kendi adı yazıyordu. Bir sonraki adımda gerçek hikâyemizi buraya ekleyeceğiz!"
                        ]
                    ]
                }
            ];

            let currentStory = null;
            let currentPageIndex = 0;

            function getBookmark() {
                try {
                    return JSON.parse(localStorage.getItem("reim_bookmark"));
                } catch (e) {
                    return null;
                }
            }

            function setBookmark(storyId, pageIndex) {
                try {
                    localStorage.setItem("reim_bookmark", JSON.stringify({ storyId: storyId, pageIndex: pageIndex }));
                } catch (e) {}
            }

            function checkBookmark() {
                const saved = getBookmark();
                const box = document.getElementById("continue-box");
                if (saved) {
                    const story = stories.find(function(s) { return s.id === saved.storyId; });
                    if (story) {
                        box.style.display = "flex";
                        document.getElementById("continue-title").textContent = story.title + " (Sayfa " + (saved.pageIndex + 1) + ")";
                        document.getElementById("continueActionBtn").onclick = function() {
                            openReader(story, saved.pageIndex);
                        };
                    }
                }
            }

            function renderStories(category) {
                const container = document.getElementById("stories-container");
                container.innerHTML = "";
                const saved = getBookmark();
                const filtered = (category === "Tümü") ? stories : stories.filter(function(s) { return s.category === category; });

                filtered.forEach(function(story) {
