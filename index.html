<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="REİM Hikâye - Özgün kısa hikâyeler, gizem, bilim kurgu ve fantastik dünyalar.">
    <title>REİM Hikâye | Özgün Öyküler ve Dünyalar</title>
    <style>
        :root {
            --bg: #f8f5f0;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --accent: #b45309;
            --border: #e2e8f0;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Georgia', serif; line-height: 1.8; transition: 0.3s; }
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); font-family: 'Segoe UI', sans-serif; }
        .theme-btn { background: var(--accent); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-family: 'Segoe UI', sans-serif; font-weight: 600; }
        .container { max-width: 850px; margin: 2.5rem auto; padding: 0 1.5rem; }
        
        /* Kaldığın Yerden Devam Et Kutusu */
        #continue-box {
            display: none;
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            font-family: 'Segoe UI', sans-serif;
        }
        .continue-info span { display: block; font-size: 0.85rem; color: var(--accent); font-weight: bold; }
        .continue-info strong { font-size: 1.1rem; }
        .continue-btn { background: var(--accent); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .intro { text-align: center; margin-bottom: 2rem; }
        .intro h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .intro p { color: var(--muted); font-family: 'Segoe UI', sans-serif; }
        .filters { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .filter-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer; font-family: 'Segoe UI', sans-serif; font-size: 0.9rem; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        
        .story-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.8rem; margin-bottom: 1.5rem; cursor: pointer; transition: 0.2s; }
        .story-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .story-meta { font-family: 'Segoe UI', sans-serif; font-size: 0.85rem; color: var(--accent); font-weight: bold; margin-bottom: 0.4rem; display: flex; justify-content: space-between; }
        .story-card h2 { font-size: 1.5rem; margin-bottom: 0.6rem; }
        .story-card p { color: var(--muted); font-size: 1rem; }
        
        /* Okuma Ekranı ve Sayfalama */
        #reader-view { display: none; background: var(--card); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border); }
        .back-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; margin-bottom: 1.5rem; font-family: 'Segoe UI', sans-serif; }
        #reader-title { font-size: 2rem; margin-bottom: 0.5rem; }
        #reader-meta { color: var(--accent); font-family: 'Segoe UI', sans-serif; margin-bottom: 1.5rem; font-size: 0.9rem; }
        #reader-content p { margin-bottom: 1.3rem; font-size: 1.15rem; }
        
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-family: 'Segoe UI', sans-serif;
        }
        .page-btn { background: var(--accent); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .page-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
        .page-indicator { font-weight: bold; color: var(--muted); }

        footer { text-align: center; padding: 2rem; color: var(--muted); font-family: 'Segoe UI', sans-serif; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo">📖 REİM Hikâye</div>
        <button class="theme-btn" onclick="toggleTheme()">🌙 Gece Modu</button>
    </header>
    <div class="container">
        <div id="list-view">
            <!-- Kaldığın Yerden Devam Et Alanı -->
            <div id="continue-box">
                <div class="continue-info">
                    <span>🔖 KALDIĞIN YERDEN DEVAM ET</span>
                    <strong id="continue-title"></strong>
                </div>
                <button class="continue-btn" id="continue-action">Okumaya Devam Et →</button>
            </div>

            <div class="intro">
                <h1>Kelimelerin Açtığı Yeni Dünyalar</h1>
                <p>REİM Hikâye arşivine hoş geldin. Okumak istediğin hikâyeyi seç.</p>
            </div>
            <div class="filters">
                <button class="filter-btn active" onclick="filterStories('Tümü', this)">Tümü</button>
                <button class="filter-btn" onclick="filterStories('Bilim Kurgu', this)">Bilim Kurgu</button>
                <button class="filter-btn" onclick="filterStories('Gizem', this)">Gizem</button>
                <button class="filter-btn" onclick="filterStories('Fantastik', this)">Fantastik</button>
            </div>
            <div id="stories-container"></div>
        </div>

        <div id="reader-view">
            <button class="back-btn" onclick="closeReader()">← Tüm Hikâyelere Dön</button>
            <div id="reader-meta"></div>
            <h1 id="reader-title"></h1>
            <div id="reader-content"></div>
            
            <!-- Sayfa Geçiş Butonları -->
            <div class="pagination">
                <button class="page-btn" id="prev-page" onclick="changePage(-1)">← Önceki Sayfa</button>
                <span class="page-indicator" id="page-indicator">Sayfa 1 / 1</span>
                <button class="page-btn" id="next-page" onclick="changePage(1)">Sonraki Sayfa →</button>
            </div>
        </div>
    </div>
    <footer>REİM Hikâye © 2026 • Tüm Hakları Saklıdır.</footer>

    <script>
        // HİKÂYELERİMİZ (Her hikâyeyi pages dizisi içinde sayfa sayfa ayırıyoruz)
        const stories = [
            {
                id: 1,
                title: "İlk Adım: Boş Sayfa",
                category: "Gizem",
                summary: "Her şey, masanın üzerinde duran eski bir defterin ilk sayfasının kendiliğinden dolmasıyla başladı...",
                pages: [
                    [
                        "SAYFA 1 — Yağmurlu bir Kasım akşamıydı. Pencereden süzülen sokak lambasının sarı ışığı, odadaki tek ahşap masanın üzerine düşüyordu.",
                        "Masanın ortasında duran deri kaplı defter yıllardır boştu. Ancak o gece ilk satırda tek bir cümle belirdi: 'Hikâyeyi yazmaya hazır mısın?'"
                    ],
                    [
                        "SAYFA 2 — Defterin sayfasını çevirdiğinde mürekkebin hâlâ ıslak olduğunu fark etti. Sanki biri saniyeler önce buradaydı.",
                        "İkinci sayfada ise artık kendi adı yazıyordu. Bir sonraki adımda seninle kurgulayacağımız gerçek hikâyeyi buraya yerleştireceğiz!"
                    ]
                ]
            }
        ];

        let currentStory = null;
        let currentPageIndex = 0;

        function checkBookmark() {
            const saved = JSON.parse(localStorage.getItem('reim_bookmark'));
            const box = document.getElementById('continue-box');
            if (saved) {
                const story = stories.find(s => s.id === saved.storyId);
                if (story) {
                    box.style.display = 'flex';
                    document.getElementById('continue-title').innerText = `${story.title} (Sayfa ${saved.pageIndex + 1} / ${story.pages.length})`;
                    document.getElementById('continue-action').onclick = () => openReader(story, saved.pageIndex);
                }
            }
        }

        function renderStories(category = 'Tümü') {
            const container = document.getElementById('stories-container');
            container.innerHTML = '';
            const saved = JSON.parse(localStorage.getItem('reim_bookmark'));
            const filtered = category === 'Tümü' ? stories : stories.filter(s => s.category === category);
            
            filtered.forEach(story => {
                const isBookmarked = saved && saved.storyId === story.id;
                const badge = isBookmarked ? `<span>📌 Sayfa ${saved.pageIndex + 1}'de kaldın</span>` : `<span>${story.pages.length} Sayfa</span>`;
                const card = document.createElement('div');
                card.className = 'story-card';
                card.onclick = () => openReader(story, isBookmarked ? saved.pageIndex : 0);
                card.innerHTML = `
                    <div class="story-meta"><span>${story.category}</span>${badge}</div>
                    <h2>${story.title}</h2>
